<!DOCTYPE html>
{% load static %}
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>

  <!-- Your CSS -->
  <link rel="stylesheet" href="{% static 'css/signup.css' %}">
</head>

<body>

  <div class="signup-card">

    <!-- Avatar icon -->
    <div class="icon-circle">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="#2e7d32" stroke-width="1.8">
        <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14c-5 0-7 2.5-7 4v1h14v-1c0-1.5-2-4-7-4z"/>
        <path stroke-linecap="round" stroke-linejoin="round" d="M19 8v4m2-2h-4"/>
      </svg>
    </div>

    <h1 class="card-title">Create Account</h1>
    <p class="card-subtitle">Sign up to get started</p>

    <!-- ✅ FORM START -->
    <form method="POST" action="{% url 'signup' %}">
      {% csrf_token %}

      <!-- Name -->
      <div class="input-wrap">
        <span class="input-icon">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round" d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </span>
        <input type="text" name="name" class="form-field" placeholder="Name" required>
      </div>

      <!-- Email -->
      <div class="input-wrap">
        <span class="input-icon">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
          </svg>
        </span>
        <input type="email" name="email" class="form-field" placeholder="Email" required>
      </div>

      <!-- Phone -->
      <div class="input-wrap">
        <span class="input-icon">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 5a2 2 0 012-2h2.28a2 2 0 011.9 1.37l.9 2.7a2 2 0 01-.45 2.05l-.97.97a16 16 0 006.29 6.29l.97-.97a2 2 0 012.05-.45l2.7.9A2 2 0 0121 17.72V20a2 2 0 01-2 2A18 18 0 013 5z"/>
          </svg>
        </span>
        <input type="tel" name="phone" class="form-field" placeholder="Phone Number" required>
      </div>

      <!-- Username -->
      <div class="input-wrap">
        <span class="input-icon">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5.121 17.804A8.966 8.966 0 0112 15c2.21 0 4.232.797 5.879 2.109M15 10a3 3 0 11-6 0 3 3 0 016 0z"/>
            <circle cx="12" cy="12" r="9"/>
          </svg>
        </span>
        <input type="text" name="username" class="form-field" placeholder="Username" required>
      </div>

      <!-- Password -->
      <div class="input-wrap">
        <span class="input-icon">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
            <rect x="5" y="11" width="14" height="10" rx="2"/>
            <path d="M8 11V7a4 4 0 018 0v4"/>
          </svg>
        </span>

        <input type="password" name="password" class="form-field" placeholder="Password" id="pwInput" required>

        <button class="toggle-pw" type="button" onclick="togglePw()">
          <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" fill="none"
            viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
            <path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
            <path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.477 0 8.268 2.943 9.542 7-1.274 4.057-5.065 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
          </svg>
        </button>
      </div>

      <button class="btn-signup" type="submit">Sign Up</button>

    </form>
    <!-- ✅ FORM END -->

    <div class="divider">OR</div>

    <p class="login-text">
      Already have an account? <a href="{% url 'login' %}">Login</a>
    </p>

  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Toggle Password -->
  <script>
    function togglePw() {
      const input = document.getElementById('pwInput');
      input.type = input.type === 'password' ? 'text' : 'password';
    }
  </script>

</body>
</html>
