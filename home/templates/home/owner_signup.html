<!DOCTYPE html>
{% load static %}
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EV Station Owner Sign Up</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>

  <!-- CSS -->
  <link rel="stylesheet" href="{% static 'css/owner_signup.css' %}">
</head>

<body>

  <div class="signup-card">

    <!-- Owner Icon -->
    <div class="icon-circle">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none"
        viewBox="0 0 24 24" stroke="#1565c0" stroke-width="1.8">

        <path stroke-linecap="round" stroke-linejoin="round"
          d="M3 10l9-7 9 7"/>

        <path stroke-linecap="round" stroke-linejoin="round"
          d="M5 9v10a1 1 0 001 1h12a1 1 0 001-1V9"/>

        <path stroke-linecap="round" stroke-linejoin="round"
          d="M9 22V12h6v10"/>
      </svg>
    </div>

    <h1 class="card-title">Owner Registration</h1>
    <p class="card-subtitle">
      Create EV Charging Station Owner Account
    </p>

    <form method="POST" action="{% url 'owner_signup' %}">
      {% csrf_token %}

      <!-- Owner Name -->
      <div class="input-wrap">
        <input type="text" name="owner_name"
          class="form-field"
          placeholder="Owner Name"
          required>
      </div>

     
      <!-- Phone -->
      <div class="input-wrap">
        <input type="tel" name="phone"
          class="form-field"
          placeholder="Phone Number"
          required>
      </div>

      <!-- Email -->
      <div class="input-wrap">
        <input type="email" name="email"
          class="form-field"
          placeholder="Email"
          required>
      </div>

      <!-- Username -->
      <div class="input-wrap">
        <input type="text" name="username"
          class="form-field"
          placeholder="Username"
          required>
      </div>

      <!-- Password -->
      <div class="input-wrap password-wrap">

        <input type="password"
          name="password"
          class="form-field"
          placeholder="Password"
          id="pwInput"
          required>

        <button class="toggle-pw"
          type="button"
          onclick="togglePw()">

          👁
        </button>

      </div>

      <!-- Submit -->
      <button class="btn-signup" type="submit">
        Register Owner
      </button>

    </form>

    <div class="divider">OR</div>

    <p class="login-text">
      Already registered?
      <a href="{% url 'owner_signup' %}">
        Owner Login
      </a>
    </p>

  </div>

  <!-- Password Toggle -->
  <script>
    function togglePw() {

      const input = document.getElementById('pwInput');

      if (input.type === 'password') {
        input.type = 'text';
      }
      else {
        input.type = 'password';
      }
    }
  </script>

</body>
</html>
