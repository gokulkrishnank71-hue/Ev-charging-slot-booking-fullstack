<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Station Staff Login | EV Point</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center min-vh-100">
  <main class="container" style="max-width: 460px;">
    <div class="card border-0 shadow p-4 rounded-4">
      <div class="text-center mb-4">
        <div class="display-5">⚡</div>
        <h1 class="h3 text-primary">Station Staff Login</h1>
        <p class="text-muted mb-0">Update live station operations and bookings</p>
      </div>
      {% for message in messages %}
        <div class="alert alert-danger">{{ message }}</div>
      {% endfor %}
      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label" for="username">Username</label>
          <input class="form-control form-control-lg" id="username" name="username" required autofocus>
        </div>
        <div class="mb-4">
          <label class="form-label" for="password">Password</label>
          <input class="form-control form-control-lg" type="password" id="password" name="password" required>
        </div>
        <button class="btn btn-primary btn-lg w-100" type="submit">Login</button>
      </form>
      <a class="text-center mt-3" href="{% url 'index' %}">Back to EV Point</a>
    </div>
  </main>
</body>
</html>
