<!DOCTYPE html>
{% load static %}
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>

<body>

  <div class="signup-card">

    <h1 class="card-title">Login</h1>
    <p class="card-subtitle">Enter your details</p>

    <!-- 🔴 Error message -->
    {% if error %}
      <p style="color:red; text-align:center;">{{ error }}</p>
    {% endif %}

    <!-- ✅ FORM -->
    <form method="POST" action="{% url 'login' %}">
      {% csrf_token %}

      <!-- Username -->
      <div class="input-wrap">
        <span class="input-icon">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M5.121 17.804A8.966 8.966 0 0112 15c2.21 0 4.232.797 5.879 2.109M15 10a3 3 0 11-6 0 3 3 0 016 0z" />
            <circle cx="12" cy="12" r="9" />
          </svg>
        </span>
        <input type="text" name="username" class="form-field"
          placeholder="Username" required>
      </div>

      <!-- Password -->
      <div class="input-wrap">
        <span class="input-icon">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
            <rect x="5" y="11" width="14" height="10" rx="2" />
            <path d="M8 11V7a4 4 0 018 0v4" />
          </svg>
        </span>

        <input type="password" name="password" class="form-field"
          placeholder="Password" id="pwInput" required>

        <button type="button" class="toggle-pw" onclick="togglePw()">
          <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" fill="none"
            viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
            <path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            <path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.477 0 8.268 2.943 9.542 7-1.274 4.057-5.065 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
          </svg>
        </button>
      </div>

      <!-- Submit -->
      <button type="submit" class="btn-signup">Login</button>

    </form>

    <div class="divider">OR</div>

    <p class="login-text">
      Don’t have an account? <a href="{% url 'signup' %}">Sign Up</a>
    </p>

  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Toggle Password -->
  <script>
    function togglePw() {
      const input = document.getElementById('pwInput');
      input.type = input.type === 'password' ? 'text' : 'password';
    }
  </script>

</body>
</html>
