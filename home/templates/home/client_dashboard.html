<!DOCTYPE html>
{% load static %}
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Dashboard</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Django static CSS -->
  <link rel="stylesheet" href="{% static 'css/client_dashboard.css' %}">
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark custom-navbar">
  <div class="container">
    <a class="navbar-brand fw-bold" href="#">EV Dashboard</a>

    <div class="ms-auto">
      <form method="POST" action="{% url 'logout' %}">
        {% csrf_token %}
        <button type="submit" class="btn btn-light btn-sm">Logout</button>
      </form>
    </div>
  </div>
</nav>

<!-- Main Section -->
<div class="container mt-5">

  <!-- Welcome -->
  <div class="welcome-box p-4 mb-4">
    <h3>Welcome, {{ request.user.username }}</h3>
    <p>Manage your EV charging bookings and stations</p>
  </div>

  <!-- Cards -->
  <div class="row g-4">

    <div class="col-md-4">
      <div class="card dashboard-card text-center">
        <div class="card-body">
          <h5>Find Stations</h5>
          <p>View EV stations near you</p>
          <a href="" class="btn btn-primary">Explore</a>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card dashboard-card text-center">
        <div class="card-body">
          <h5>Book Slot</h5>
          <p>Reserve your charging time</p>
          <a href="" class="btn btn-primary">Book Now</a>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card dashboard-card text-center">
        <div class="card-body">
          <h5>My Bookings</h5>
          <p>Check your reservations</p>
          <a href="" class="btn btn-primary">View</a>
        </div>
      </div>
    </div>

  </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
