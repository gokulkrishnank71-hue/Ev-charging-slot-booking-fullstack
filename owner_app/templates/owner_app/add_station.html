{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EV Station Registration</title>
</head>

<body>

  <div class="container">

    <div class="image-section">

<img src="{% static 'css/images/ev_charging_station_2c7da8f67c.jpg' %}" alt="EV Charging">
      <div class="overlay">
        <h1>EV Charging Station</h1>
        <p>Add your station and manage bookings easily.</p>
      </div>

    </div>

    <div class="form-section">

      <h2>Register Station</h2>
      <p>Enter your station details below</p>

      <form method="POST">

        {% csrf_token %}

        <div class="input-group">
          <label>Station Name</label>

          <input 
            type="text"
            name="station_name"
            placeholder="Enter station name"
            required
          >
        </div>

        <div class="input-group">

          <label>City</label>

          <select name="city" required>

            <option value="">Select City</option>

            <option>Kochi</option>
            <option>Trivandrum</option>
            <option>Calicut</option>
            <option>Thrissur</option>
            <option>Kannur</option>
            <option>Bangalore</option>
            <option>Chennai</option>
            <option>Coimbatore</option>

          </select>

        </div>

        <div class="input-group">

          <label>Station Type</label>

          <select name="station_type" required>

            <option value="">Select Type</option>

            <option>Fast Charging</option>
            <option>Normal Charging</option>
            <option>Battery Swapping</option>

          </select>

        </div>

        <div class="input-group">

          <label>Total Slots</label>

          <input 
            type="number"
            name="total_slots"
            placeholder="Enter total slots"
            required
          >

        </div>

        <div class="input-group">

          <label>Rate Per Unit (₹)</label>

          <input 
            type="number"
            name="rate_per_unit"
            placeholder="Enter rate per unit"
            required
          >

        </div>

        <div class="input-group">

          <label>Phone Number</label>

          <input 
            type="tel"
            name="phone_number"
            placeholder="Enter phone number"
            maxlength="10"
            required
          >

        </div>

        <button type="submit" class="btn">
          Add Station
        </button>

      </form>

    </div>

  </div>

</body>

<style>

  *{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
  }

  body{
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(to right, #dbeafe, #ffffff);
    padding: 20px;
  }

  .container{
    width: 950px;
    background: white;
    border-radius: 20px;
    overflow: hidden;
    display: flex;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
  }

  .image-section{
    width: 50%;
    position: relative;
  }

  .image-section img{
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .overlay{
    position: absolute;
    bottom: 20px;
    left: 20px;
    color: white;
    background: rgba(0,0,0,0.4);
    padding: 15px;
    border-radius: 10px;
  }

  .form-section{
    width: 50%;
    padding: 40px;
  }

  .form-section h2{
    color: #2563eb;
    margin-bottom: 10px;
    font-size: 32px;
  }

  .form-section p{
    color: gray;
    margin-bottom: 25px;
  }

  .input-group{
    margin-bottom: 18px;
  }

  .input-group label{
    display: block;
    margin-bottom: 8px;
    font-weight: bold;
    color: #333;
  }

  .input-group input,
  .input-group select{
    width: 100%;
    padding: 12px;
    border: 1px solid #93c5fd;
    border-radius: 10px;
    outline: none;
    font-size: 15px;
  }

  .input-group input:focus,
  .input-group select:focus{
    border-color: #2563eb;
    box-shadow: 0 0 5px rgba(37,99,235,0.5);
  }

  .btn{
    width: 100%;
    padding: 14px;
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
  }

  .btn:hover{
    background: #1d4ed8;
  }

  @media(max-width: 768px){

    .container{
      flex-direction: column;
    }

    .image-section,
    .form-section{
      width: 100%;
    }

    .image-section{
      height: 250px;
    }
  }

</style>

</html>
