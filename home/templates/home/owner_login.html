<!-- owner_login.html -->

<!DOCTYPE html>
{% load static %}
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0"/>

  <title>Owner Login</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"/>

  <style>

    body{
      background:#f3f4f8;
      font-family: Arial, sans-serif;

      display:flex;
      justify-content:center;
      align-items:center;

      min-height:100vh;
      margin:0;
    }

    .login-card{

      width:100%;
      max-width:420px;

      background:white;

      padding:45px 35px;

      border-radius:24px;

      box-shadow:0 4px 20px rgba(0,0,0,0.05);

      text-align:center;
    }

    .icon-circle{

      width:95px;
      height:95px;

      background:#e8f0fe;

      border-radius:50%;

      display:flex;
      justify-content:center;
      align-items:center;

      margin:0 auto 25px;
    }

    .card-title{

      color:#1565c0;

      font-size:42px;

      font-weight:700;

      margin-bottom:10px;
    }

    .card-subtitle{

      color:#666;

      margin-bottom:35px;

      font-size:17px;
    }

    .input-wrap{

      margin-bottom:20px;

      position:relative;
    }

    .form-field{

      width:100%;

      height:58px;

      border:1px solid #d9d9d9;

      border-radius:14px;

      padding:0 18px;

      font-size:17px;

      outline:none;

      transition:0.3s;
    }

    .form-field:focus{

      border-color:#1565c0;

      box-shadow:0 0 0 3px rgba(21,101,192,0.1);
    }

    .password-wrap{

      position:relative;
    }

    .toggle-pw{

      position:absolute;

      right:15px;
      top:50%;

      transform:translateY(-50%);

      border:none;

      background:none;

      font-size:18px;

      cursor:pointer;
    }

    .btn-login{

      width:100%;

      height:58px;

      border:none;

      border-radius:14px;

      background:#1565c0;

      color:white;

      font-size:20px;

      font-weight:600;

      transition:0.3s;
    }

    .btn-login:hover{

      background:#0d47a1;
    }

    .divider{

      margin:25px 0;

      color:#777;

      font-weight:600;
    }

    .signup-text{

      font-size:16px;
    }

    .signup-text a{

      text-decoration:none;

      color:#1565c0;

      font-weight:600;
    }

    .alert{

      text-align:left;
    }

  </style>

</head>

<body>

  <div class="login-card">

    <!-- Icon -->
    <div class="icon-circle">

      <svg xmlns="http://www.w3.org/2000/svg"
           fill="none"
           viewBox="0 0 24 24"
           stroke="#1565c0"
           stroke-width="1.8"
           width="48">

        <path stroke-linecap="round"
              stroke-linejoin="round"
              d="M15.75 9V5.25A3.75 3.75 0 008.25 5.25V9"/>

        <path stroke-linecap="round"
              stroke-linejoin="round"
              d="M6.75 9h10.5A1.5 1.5 0 0118.75 10.5v7.5a1.5 1.5 0 01-1.5 1.5H6.75a1.5 1.5 0 01-1.5-1.5v-7.5A1.5 1.5 0 016.75 9z"/>

      </svg>

    </div>

    <h1 class="card-title">
      Owner Login
    </h1>

    <p class="card-subtitle">
      Login to manage your EV charging stations
    </p>

    {% if error %}

    <div class="alert alert-danger">

      {{ error }}

    </div>

    {% endif %}

    <form method="POST"
          action="{% url 'owner_login' %}">

      {% csrf_token %}

      <!-- Username -->
      <div class="input-wrap">

        <input type="text"
               name="username"
               class="form-field"
               placeholder="Username"
               required>

      </div>

      <!-- Password -->
      <div class="input-wrap password-wrap">

        <input type="password"
               name="password"
               class="form-field"
               placeholder="Password"
               id="pwInput"
               required>

        <button type="button"
                class="toggle-pw"
                onclick="togglePw()">

          👁

        </button>

      </div>

      <!-- Submit -->
      <button class="btn-login"
              type="submit">

        Login

      </button>

    </form>

    <div class="divider">
      OR
    </div>

    <p class="signup-text">

      Don't have an account?

      <a href="{% url 'owner_signup' %}">
        Register Owner
      </a>

    </p>

  </div>

  <script>

    function togglePw(){

      const input =
        document.getElementById('pwInput');

      if(input.type === 'password'){

        input.type = 'text';

      }

      else{

        input.type = 'password';

      }
    }

  </script>

</body>
</html>
